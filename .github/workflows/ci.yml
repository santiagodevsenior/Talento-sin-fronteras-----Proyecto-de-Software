name: CI — Build, Lint & Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  backend:
    name: Backend — Lint, Test & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: tsf_test
          POSTGRES_USER: tsf_user
          POSTGRES_PASSWORD: tsf_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Lint server code
        run: cd server && npm run lint

      - name: Run tests with coverage
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: tsf_test
          DB_USER: tsf_user
          DB_PASSWORD: tsf_password
          JWT_SECRET: test_secret_for_ci
          JWT_EXPIRES_IN: 1h
        run: cd server && npm test -- --coverage --forceExit

  frontend:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Lint client code
        run: cd client && npm run lint

      - name: Build React app
        env:
          REACT_APP_API_URL: https://tsf-api.onrender.com/api
          REACT_APP_SOCKET_URL: https://tsf-api.onrender.com
          CI: false
        run: cd client && npm run build

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: cd client && npm ci && npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: cd client && npx playwright test
        env:
          BASE_URL: http://localhost:3000
