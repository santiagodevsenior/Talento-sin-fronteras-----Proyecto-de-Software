name: CI — Build, Lint & Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres123';"
          sudo -u postgres psql -c "CREATE DATABASE talento_sin_frontera_test;"

      - name: Install dependencies
        run: cd server && npm install

      - name: Lint
        run: cd server && npm run lint
        continue-on-error: true

      - name: Run tests
        run: cd server && npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: talento_sin_frontera_test
          DB_USER: postgres
          DB_PASSWORD: postgres123
          JWT_SECRET: test_secret_ci_123
          JWT_EXPIRES_IN: 1h
          CLIENT_URL: http://localhost:3000

  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm install

      - name: Build
        run: cd client && npm run build
        env:
          REACT_APP_API_URL: https://talento-sin-fronteras-proyecto-de.onrender.com/api
          REACT_APP_SOCKET_URL: https://talento-sin-fronteras-proyecto-de.onrender.com
          CI: false